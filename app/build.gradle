
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.Rio'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.Rio"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
