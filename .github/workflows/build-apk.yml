from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.label import Label
from kivy.uix.textinput import TextInput
from kivy.uix.button import Button
from kivy.core.audio import SoundLoader
from gtts import gTTS
import os, random, datetime

RESPONSES = [
    "Yo boss! You called RIO?",
    "Haha I'm here! What's up?",
    "RIO in the house!"
]

def speak(text, label=None):
    if label: 
        label.text = f"RIO: {text}"
    try:
        tts = gTTS(text=text, lang='en')
        tts.save("/sdcard/rio.mp3")
        # Load and play the file
        sound = SoundLoader.load("/sdcard/rio.mp3")
        if sound:
            sound.play()
    except Exception as e: 
        print(f"Audio Error: {e}")

def rio_brain(user_text):
    txt = user_text.lower()
    if "time" in txt:
        return f"It's {datetime.datetime.now().strftime('%H:%M')} boss!"
    if "joke" in txt:
        return "Why did RIO cross road? To debug you!"
    return random.choice(RESPONSES) + f" You said: {user_text}"

class RIO_UI(BoxLayout):
    def __init__(self, **kwargs):  # Fixed typo: __init__ had only one leading underscore
        super().__init__(orientation='vertical', **kwargs)  # Fixed typo: __init__ 
        
        self.chat = Label(text="RIO: Say 'RIO' to wake me!")  # Added missing '=' sign
        self.add_widget(self.chat)
        
        self.input = TextInput(hint_text="Type: Rio what time?", multiline=False)  # Added missing '=' sign
        self.add_widget(self.input)
        
        btn = Button(text="TALK")
        btn.bind(on_press=self.talk)
        self.add_widget(btn)

    def talk(self, instance):  # Added 'instance' parameter required by Kivy button binds
        ans = rio_brain(self.input.text)
        speak(ans, self.chat)
        self.input.text = ""  # Fixed incomplete string assignment

# Added the main App wrapper to actually run the program
class RioApp(App):
    def build(self):
        return RIO_UI()

if __name__ == '__main__':
    RioApp().run()
