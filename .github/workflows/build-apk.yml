name: Build RIO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Create Rio Project
        run: |
          mkdir -p app/src/main/java/com/rio/voice
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.2.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10" }
          }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.rio.voice'; compileSdk 34; defaultConfig { applicationId "com.rio.voice"; minSdk 26; targetSdk 34; versionCode 1; versionName "1" } buildTypes { release { minifyEnabled false } } }
          dependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.appcompat:appcompat:1.6.1" }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.CALL_PHONE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
            <application android:label="Rio" android:theme="@android:style/Theme.Black">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".RioService" android:foregroundServiceType="microphone"/>
            </application>
          </manifest>
          MAN
          cat > app/src/main/java/com/rio/voice/MainActivity.kt << 'KT'
          package com.rio.voice; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() { override fun onCreate(s: Bundle?) { super.onCreate(s); startForegroundService(android.content.Intent(this, RioService::class.java)) } }
          KT
          cat > app/src/main/java/com/rio/voice/RioService.kt << 'KT'
          package com.rio.voice; import android.app.*; import android.content.Intent; import android.os.IBinder
          class RioService : Service() {
            private lateinit var voice: RioVoiceManager
            override fun onCreate() { super.onCreate(); val ch = NotificationChannel("rio","Rio", NotificationManager.IMPORTANCE_LOW); (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch); val notif = Notification.Builder(this,"rio").setContentTitle("Rio listening...").setSmallIcon(android.R.drawable.ic_btn_speak_now).build(); startForeground(1, notif); voice = RioVoiceManager(this); voice.startListening() }
            override fun onBind(i: Intent?): IBinder? = null
          }
          KT
          cat > app/src/main/java/com/rio/voice/RioVoiceManager.kt << 'KT'
          package com.rio.voice; import android.content.*; import android.os.Bundle; import android.speech.*; import android.speech.tts.TextToSpeech; import java.util.Locale
          class RioVoiceManager(val ctx: Context): TextToSpeech.OnInitListener {
            var tts: TextToSpeech = TextToSpeech(ctx,this); var sr: SpeechRecognizer = SpeechRecognizer.createSpeechRecognizer(ctx)
            fun startListening(){ val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply { putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM) }; sr.setRecognitionListener(object: RecognitionListener { override fun onResults(p0: Bundle?) { val text = p0?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?: ""; if(text.lowercase().contains("rio")){ speak("At your service boss"); RioActions(ctx).execute(text) }; startListening() }; override fun onError(p0: Int) { startListening() }; override fun onReadyForSpeech(p0: Bundle?) {}; override fun onBeginningOfSpeech() {}; override fun onRmsChanged(p0: Float) {}; override fun onBufferReceived(p0: ByteArray?) {}; override fun onEndOfSpeech() {}; override fun onEvent(p0: Int, p1: Bundle?) {}; override fun onPartialResults(p0: Bundle?) {} }); try { sr.startListening(intent) } catch(e: Exception){} }
            fun speak(s: String){ tts.speak(s, TextToSpeech.QUEUE_FLUSH, null, null) }
            override fun onInit(p0: Int) { tts.language = Locale.US }
          }
          KT
          cat > app/src/main/java/com/rio/voice/RioActions.kt << 'KT'
          package com.rio.voice; import android.content.*; import android.hardware.camera2.CameraManager; import android.media.AudioManager; import android.provider.ContactsContract
          class RioActions(val ctx: Context){
            fun execute(cmd: String){ val c = cmd.lowercase(); when { c.contains("open youtube") -> open("com.google.android.youtube","YouTube"); c.contains("open whatsapp") -> open("com.whatsapp","WhatsApp"); c.contains("open chrome") -> open("com.android.chrome","Chrome"); c.contains("call") -> call(c); c.contains("where are you") -> { val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager; try{cm.setTorchMode(cm.cameraIdList[0], true)}catch(e: Exception){}; RioVoiceManager(ctx).speak("Flashlight on, I'm here boss") }; c.contains("volume") -> { val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager; if(c.contains("down")) am.adjustVolume(-1, AudioManager.FLAG_SHOW_UI) else am.adjustVolume(1, AudioManager.FLAG_SHOW_UI) } } }
            fun open(pkg: String, name: String){ val i = ctx.packageManager.getLaunchIntentForPackage(pkg); if(i!=null){ i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i); RioVoiceManager(ctx).speak("$name opened") } }
            fun call(c: String){ val name = c.replace("rio","").replace("call","").trim(); val cr = ctx.contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE?", arrayOf("%$name%"), null); if(cr!=null && cr.moveToFirst()){ val num = cr.getString(cr.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER)); val intent = Intent(Intent.ACTION_CALL).apply { data = android.net.Uri.parse("tel:$num"); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }; ctx.startActivity(intent); RioVoiceManager(ctx).speak("Calling $name") }; cr?.close() }
          }
          KT
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
