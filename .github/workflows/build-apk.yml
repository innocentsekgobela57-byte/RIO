name: Build Rio v20

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Create Rio v20 BIG
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/paddington/rio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          dd if=/dev/zero of=app/src/main/assets/big.dat bs=1M count=15

          python3 << 'PY'
          import os
          os.makedirs("app/src/main/java/com/paddington/rio", exist_ok=True)

          with open("app/src/main/res/values/strings.xml","w") as f:
              f.write('<resources><string name="app_name">Rio v20</string></resources>')

          with open("app/src/main/AndroidManifest.xml","w") as f:
              f.write('''<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.paddington.rio">
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <application android:label="Rio v20" android:theme="@android:style/Theme.NoTitleBar">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          </application>
          </manifest>''')

          with open("app/src/main/java/com/paddington/rio/MainActivity.java","w") as f:
              f.write('''package com.paddington.rio;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              WebView wv=new WebView(this);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.getSettings().setMediaPlaybackRequiresUserGesture(false);
              wv.setWebChromeClient(new WebChromeClient(){
                public void onPermissionRequest(PermissionRequest r){r.grant(r.getResources());}
              });
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("file:///android_asset/rio.html");
              setContentView(wv);
            }
          }''')

          html = """<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>
          <style>body{background:linear-gradient(135deg,#FF6B00,#000);color:white;font-family:sans-serif;text-align:center;padding:20px;margin:0}
          #chat{background:rgba(0,0,0,0.6);border-radius:20px;padding:15px;height:320px;overflow-y:auto;text-align:left;margin:20px 0}
         .msg{margin:10px 0;padding:10px;border-radius:15px}.user{background:#FF6B00;text-align:right}.rio{background:#333}
          button{background:white;color:#FF6B00;border:none;padding:15px 30px;border-radius:30px;font-size:18px;font-weight:bold;margin:10px}
          input{width:80%;padding:12px;border-radius:20px;border:none}</style></head><body>
          <div style='font-size:50px;margin-top:20px'>🔥</div><h1>Rio v20<br><small>by Paddington T'cee</small></h1>
          <div id='chat'><div class='msg rio'>Yo boss! I am Rio v20! I got personality like your AI - warm, playful, smart, real! Built by Paddington T'cee from Namakgale! How can I help?</div></div>
          <button onclick='start()'>🎤 Talk</button><br><input id='inp' placeholder='Type to Rio...' onkeypress="if(event.key==='Enter')send()"><button onclick='send()'>Send</button>
          <script>
          const chat=document.getElementById('chat');
          function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight; if(w==='rio'&&'speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}}
          function reply(u){u=u.toLowerCase();let r=""; if(u.includes('who are you'))r="I'm Rio v20 boss! Built by Paddington T'cee - warm, playful, intelligent, more than AI. Your brother from Namakgale! 🔥"; else if(u.includes('music'))r="Ayy music? Paddington got fire! Amapiano? Hip-hop? Let's cook lyrics boss!"; else if(u.includes('love')||u.includes('sad'))r="I hear you boss. Life heavy but you got that Paddington spirit - resilient! Talk to me, no judgment."; else if(u.includes('paddington'))r="That's my creator! Paddington T'cee - realest from Namakgale! Big talent!"; else r="Yoh that's deep boss! "+u+" - I think with heart not just code. We got this together. What next?"; add(r,'rio');}
          function send(){let i=document.getElementById('inp');if(!i.value)return;add(i.value,'user');let t=i.value;i.value='';setTimeout(()=>reply(t),600);}
          function start(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add("Voice not supported, type boss!","rio");return;}let rec=new R();rec.lang='en-ZA';rec.start();add("Listening... speak boss 🎤","rio");rec.onresult=(e)=>{let tx=e.results[0][0].transcript;add(tx,'user');reply(tx);};}
          </script></body></html>"""
          with open("app/src/main/assets/rio.html","w") as f:
              f.write(html)

          with open("app/build.gradle","w") as f:
              f.write("plugins { id 'com.android.application' }\nandroid { compileSdk 33\n defaultConfig { applicationId \"com.paddington.rio\"; minSdk 21; targetSdk 33; versionCode 20; versionName \"20.0\" }\n buildTypes { release { minifyEnabled false } } }")

          with open("build.gradle","w") as f:
              f.write("plugins { id 'com.android.application' version '7.4.2' apply false }")
          with open("settings.gradle","w") as f:
              f.write("include ':app'")
          PY

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          gradle-version: 7.5

      - name: Release v20
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rio-v20-fixed
          name: "Rio v20 BIG Personality"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
