package com.rio.ai

import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.hardware.camera2.CameraManager
import android.media.AudioManager
import android.os.Bundle
import android.speech.RecognizerIntent
import android.widget.Button
import android.widget.EditText
import android.widget.TextView
import android.widget.Toast
import androidx.activity.result.contract.ActivityResultContracts
import androidx.appcompat.app.AppCompatActivity
import java.util.Locale
import kotlin.random.Random

class MainActivity : AppCompatActivity() {

    private lateinit var cameraManager: CameraManager
    private lateinit var audioManager: AudioManager
    private lateinit var inputText: EditText
    private lateinit var resultText: TextView

    private val jokes = listOf(
        "Why did the phone go to school? To improve its CELL-f!",
        "I told my phone a joke, it CRACKED up!",
        "Why is Rio the best AI? Because he never runs out of BATTERY!"
    )

    private val speechLauncher = registerForActivityResult(
        ActivityResultContracts.StartActivityForResult()
    ) { res ->
        val spoken = res.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.get(0)?: ""
        inputText.setText(spoken)
        handleMix(spoken.lowercase())
    }

    private val askMic = registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
        if(ok) startVoice() else Toast.makeText(this, "Need mic bro!", Toast.LENGTH_SHORT).show()
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        cameraManager = getSystemService(CameraManager::class.java)
        audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
        inputText = findViewById(R.id.inputText)
        resultText = findViewById(R.id.resultText)

        findViewById<Button>(R.id.btnSend).setOnClickListener {
            handleMix(inputText.text.toString().lowercase())
        }
        findViewById<Button>(R.id.btnMic).setOnClickListener {
            if(checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) startVoice()
            else askMic.launch(android.Manifest.permission.RECORD_AUDIO)
        }
    }

    private fun startVoice() {
        val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
            putExtra(RecognizerIntent.EXTRA_PROMPT, "Rio is listening...")
        }
        try { speechLauncher.launch(i) } catch (e: Exception) { Toast.makeText(this, "No speech app", Toast.LENGTH_SHORT).show() }
    }

    private fun handleMix(cmd: String) {
        try {
            when {
                // TORCH
                cmd.contains("torch on") || cmd.contains("flash on") -> { setTorch(true); resultText.text = "Torch ON 🔦" }
                cmd.contains("torch off") || cmd.contains("flash off") -> { setTorch(false); resultText.text = "Torch OFF" }

                // VOLUME - NEW MIX
                cmd.contains("volume up") || cmd.contains("increase volume") -> {
                    audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                    resultText.text = "Volume Up 🔊"
                }
                cmd.contains("volume down") || cmd.contains("decrease volume") -> {
                    audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                    resultText.text = "Volume Down 🔉"
                }
                cmd.contains("mute") -> {
                    audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI)
                    resultText.text = "Muted 🔇"
                }

                // JOKES - NEW MIX
                cmd.contains("joke") || cmd.contains("crack") -> {
                    resultText.text = jokes[Random.nextInt(jokes.size)]
                }

                // DATA/WIFI - INFO (Android 10+ can't toggle directly)
                cmd.contains("data on") || cmd.contains("wifi on") -> {
                    resultText.text = "Bro, Android blocks direct Data/WIFI toggle for security. I can open settings for you."
                    startActivity(Intent(android.provider.Settings.ACTION_WIRELESS_SETTINGS))
                }

                // OPEN APP
                cmd.contains("open") -> {
                    val name = cmd.replace("open", "").trim()
                    openApp(name)
                }

                else -> resultText.text = "I got you: torch on/off, volume up/down, crack a joke, open [app]"
            }
        } catch (e: Exception) {
            resultText.text = "Crash blocked: ${e.message}"
        }
    }

    private fun setTorch(on: Boolean) {
        try {
            val id = cameraManager.cameraIdList[0]
            cameraManager.setTorchMode(id, on)
        } catch (e: Exception) { resultText.text = "Torch error" }
    }

    private fun openApp(name: String) {
        try {
            val pm = packageManager
            for (app in pm.getInstalledApplications(0)) {
                val label = pm.getApplicationLabel(app).toString().lowercase()
                // MIX FIX: nicknames
                val nick = name.replace("fb", "facebook").replace("yt", "youtube").replace("wp", "whatsapp")
                if (label.contains(nick)) {
                    pm.getLaunchIntentForPackage(app.packageName)?.let { startActivity(it); resultText.text = "Opening $label 🚀"; return }
                }
            }
            resultText.text = "App not found: $name"
        } catch (e: Exception) { resultText.text = "Open failed" }
    }
}: Rio V8 Stable
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Create Rio V8
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/paddington/rio
          mkdir -p app/src/main/res/values
          echo '<resources><string name="app_name">Rio V8</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.paddington.rio"><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/><uses-permission android:name="android.permission.FLASHLIGHT"/><application android:label="Rio V8" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/build.gradle << 'GR'
          apply plugin: 'com.android.application'
          android {
            compileSdkVersion 30
            defaultConfig { applicationId "com.paddington.rio"; minSdkVersion 21; targetSdkVersion 30; versionCode 8; versionName "8.0" }
            buildTypes { release { minifyEnabled false } }
          }
          GR
          cat > build.gradle << 'GR2'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GR2
          echo "include ':app'" > settings.gradle
          cat > app/src/main/java/com/paddington/rio/MainActivity.java << 'JAVA'
          package com.paddington.rio;
          import android.app.Activity; import android.os.Bundle; import android.content.pm.*;
          import android.content.Intent; import android.hardware.camera2.CameraManager;
          import android.widget.*; import android.graphics.Color;
          public class MainActivity extends Activity {
            TextView log; EditText input; CameraManager camMan; String camId;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              android.widget.LinearLayout root=new android.widget.LinearLayout(this); root.setOrientation(1);
              root.setBackgroundColor(Color.parseColor("#111111")); root.setPadding(30,30,30,30);
              TextView title=new TextView(this); title.setText("RIO V8\nby Paddington T'cee"); title.setTextColor(Color.parseColor("#FF6B00")); title.setTextSize(24); title.setGravity(17); root.addView(title);
              log=new TextView(this); log.setTextColor(Color.WHITE); log.setText("Yo boss! Rio V8 - stable & fast!\n\nCommands:\n- open whatsapp / tiktok / youtube\n- torch on / torch off"); root.addView(log);
              input=new EditText(this); input.setHint("Type: open whatsapp"); input.setTextColor(Color.WHITE); root.addView(input);
              Button btn=new Button(this); btn.setText("SEND TO RIO"); btn.setOnClickListener(v->{ handle(input.getText().toString()); input.setText(""); }); root.addView(btn);
              setContentView(root);
              try{ camMan=(CameraManager)getSystemService(CAMERA_SERVICE); camId=camMan.getCameraIdList()[0]; }catch(Exception e){}
            }
            void handle(String cmd){
              if(cmd.isEmpty())return; log.append("\n\nYou: "+cmd); String lower=cmd.toLowerCase();
              if(lower.contains("torch on")){ try{ camMan.setTorchMode(camId,true); log.append("\nRio: Torch ON boss!"); }catch(Exception e){ log.append("\nRio: No torch"); } return; }
              if(lower.contains("torch off")){ try{ camMan.setTorchMode(camId,false); log.append("\nRio: Torch OFF"); }catch(Exception e){} return; }
              if(lower.startsWith("open ")){
                String appName=lower.replace("open ","").trim();
                PackageManager pm=getPackageManager(); for(ApplicationInfo app: pm.getInstalledApplications(0)){
                  String label=pm.getApplicationLabel(app).toString().toLowerCase();
                  if(label.contains(appName)){ Intent launch=pm.getLaunchIntentForPackage(app.packageName); if(launch!=null){ startActivity(launch); log.append("\nRio: Opening "+pm.getApplicationLabel(app)+" boss!"); return; } }
                }
                log.append("\nRio: Couldn't find "+appName); return;
              }
              log.append("\nRio: I hear you - "+cmd+" - try open [app] or torch on/off boss!");
            }
          }
          JAVA

      - name: Build APK V8
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug --no-daemon --stacktrace
          gradle-version: 6.7.1
          cache-disabled: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rio-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release V8
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rio-v8-${{ github.run_number }}
          name: "Rio V8 Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
