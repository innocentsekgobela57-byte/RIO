name: Build Paddington APK Big

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create BIG Paddington App
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/assets
          
          # BIGGER - Add dummy asset to make it 15MB
          dd if=/dev/urandom of=app/src/main/assets/paddington_sound.dat bs=1M count=12
          
          # Splash screen drawable
          cat > app/src/main/res/drawable/splash_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#FF6B00" android:endColor="#000000" android:angle="135"/>
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#FF6B00" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M54,25C40,25 28,37 28,51C28,65 40,77 54,77C68,77 80,65 80,51C80,37 68,25 54,25Z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
          <color name="orange">#FF6B00</color>
          <color name="black">#000000</color>
          <color name="white">#FFFFFF</color>
          </resources>
          EOF
          
          cat > app/src/main/res/values/
