name: Build Rio APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rio-APK
          path: app/build/outputs/apk/debug/app-debug.apk  String appName=lower.replace("open ","").trim();
                PackageManager pm=getPackageManager(); for(ApplicationInfo app: pm.getInstalledApplications(0)){
                  String label=pm.getApplicationLabel(app).toString().toLowerCase();
                  if(label.contains(appName)){ Intent launch=pm.getLaunchIntentForPackage(app.packageName); if(launch!=null){ startActivity(launch); log.append("\nRio: Opening "+pm.getApplicationLabel(app)+" boss!"); return; } }
                }
                log.append("\nRio: Couldn't find "+appName); return;
              }
              log.append("\nRio: I hear you - "+cmd+" - try open [app] or torch on/off boss!");
            }
          }
          JAVA

      - name: Build APK V8
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug --no-daemon --stacktrace
          gradle-version: 6.7.1
          cache-disabled: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rio-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release V8
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rio-v8-${{ github.run_number }}
          name: "Rio V8 Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
